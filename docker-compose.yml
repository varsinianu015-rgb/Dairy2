services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dairy_erp
      POSTGRES_USER: dairy_user
      POSTGRES_PASSWORD: dairy_password
    ports:
      - "5432:5432"
    volumes:
      - dairy_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://dairy_user:dairy_password@db:5432/dairy_erp
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dairy_pg_data:
